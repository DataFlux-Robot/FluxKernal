name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build pytest
      - run: python -m build
      - run: python scripts/smoke_distribution.py
      - run: python -m pip install .
      - run: python -m pytest tests/test_onboarding.py tests/test_constraints.py tests/test_agent_workspace.py -q
  agent:
    name: MCP / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[agent,dev]'
      - run: python -m pytest tests/test_agent.py -k 'not stdio_complete_revision' -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  robot-library:
    name: Robot library / offline Lean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Lean and local converter
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          python -m pip install . pytest
      - run: python -m pytest tests/test_robot_library.py -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - name: Execute bundled Lean with socket syscalls denied
        run: python scripts/without_network.py python scripts/robot_library.py verify --execute --output library-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-library-verification
          path: library-verification.json
  studio:
    name: CAD + real Lean + installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Lean launcher
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake build
      - run: python -m pip install -e '.[demo,agent,dev,robot,personalize]'
      - run: python -m pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - name: Cross-product CAD and Lean regression
        run: fk asset benchmark --output ./asset-evaluation --json > asset-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-product-assets
          path: asset-benchmark.json
      - run: python -m build
      - run: python scripts/smoke_distribution.py --studio --agent --robot --personalize
      - name: Installed robot wheel with runtime network denied
        run: python scripts/smoke_distribution.py --robot --offline
