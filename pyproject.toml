[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxkernel"
version = "0.1.0"
description = "FluxKernel: content-addressed, certificate-carrying refinement-graph kernel for LLM-driven CAD + MBSE (fk CLI + .fcad DSL)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# NOTE layer discipline: core/ and store/ import NOTHING third-party.
# numpy/scipy/OCP are used only inside solvers/ (L2). Kept as optional extras
# so the pure kernel (L0-L4 minus geometry) installs with zero dependencies.
dependencies = []

[project.optional-dependencies]
solvers = ["numpy", "scipy"]
geom = ["cadquery-ocp>=8.0"]
all = ["numpy", "scipy", "cadquery-ocp>=8.0"]
dev = ["pytest"]
demo = ["fastapi>=0.115", "uvicorn>=0.30", "httpx[socks]>=0.27", "python-multipart>=0.0.12", "pillow>=10", "numpy", "scipy", "cadquery-ocp>=8.0"]

[project.scripts]
fk = "fluxkernel.interface.cli:main"
fk-studio = "fluxkernel.demo.server:main"

[tool.setuptools.packages.find]
include = ["fluxkernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["run_tests.py", "test_*.py"]

[tool.setuptools.package-data]
"fluxkernel.demo" = ["static/*", "static/vendor/*", "static/references/*"]
