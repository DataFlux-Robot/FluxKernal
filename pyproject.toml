[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxkernel"
version = "0.12.1"
description = "An evidence-carrying design and manufacturing kernel for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# NOTE layer discipline: core/ and store/ import NOTHING third-party.
# numpy/scipy/OCP are used only inside solvers/ (L2). Kept as optional extras
# so the pure kernel (L0-L4 minus geometry) installs with zero dependencies.
dependencies = []

[project.optional-dependencies]
solvers = ["numpy", "scipy"]
geom = ["cadquery-ocp>=8.0"]
all = ["numpy", "scipy", "cadquery-ocp>=8.0"]
dev = ["pytest", "build>=1.2"]
personalize = ["build123d>=0.13,<0.14", "pydantic>=2.10,<3", "httpx[socks]>=0.27", "mujoco>=3.3,<4", "pillow>=10"]
robot = ["mujoco>=3.3,<4", "pillow>=10"]
agent = ["mcp>=2.2,<3"]
demo = ["pydantic>=2.10,<3", "fastapi>=0.115", "uvicorn>=0.30", "httpx[socks]>=0.27", "python-multipart>=0.0.12", "pillow>=10", "numpy", "scipy", "cadquery-ocp>=8.0"]

[project.urls]
Homepage = "https://www.datafluxdynamics.ltd/technology/fluxkernel/"
Repository = "https://github.com/ExuberantWitness/fluxkernel"
Documentation = "https://github.com/ExuberantWitness/fluxkernel/tree/master/docs"
Issues = "https://github.com/ExuberantWitness/fluxkernel/issues"

[project.scripts]
fk = "fluxkernel.interface.cli:main"
fk-studio = "fluxkernel.demo.server:main"
fk-mcp = "fluxkernel.agent_server:main"

[tool.setuptools.packages.find]
include = ["fluxkernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["run_tests.py", "test_*.py"]

[tool.setuptools.package-data]
"fluxkernel" = ["asset_schemas/*.json"]
"fluxkernel.demo" = ["static/*", "static/vendor/*", "static/references/*", "tasks/*.json", "skills/*/SKILL.md", "skills/*/references/*.md"]
